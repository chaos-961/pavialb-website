name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          install -d _site/admin _site/css _site/js _site/assets
          cp index.html robots.txt sitemap.xml manifest.webmanifest service-worker.js _site/
          cp admin/index.html admin/payload.js _site/admin/
          cp css/styles.css css/admin.css _site/css/
          cp js/app.js js/admin.js js/backend.js js/backend-config.js js/backend-firebase.js js/firebase-config.js js/config.js js/image-catalog.js js/drive-images.js js/store-core.js js/catalog-cache.js js/products.js _site/js/
          cp assets/logo.svg _site/assets/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
