<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- CSP for the Studio. script-src keeps 'unsafe-inline' because admin.js
         injects the decrypted dashboard as an inline <script> (no src) — a strict
         script-src would block it and break the whole admin. The Firebase RTDB
         origins are in BOTH connect-src (WebSocket) AND script-src: RTDB's long-poll
         fallback injects a <script src=".../.lp?..."> when the socket can't open
         (e.g. behind Cloudflare), so a script-src without them loads the Studio with
         no data. static.cloudflareinsights.com is Cloudflare's auto-injected
         analytics beacon. img-src allows the imgbb image CDN (i.ibb.co); connect-src
         allows the imgbb upload API (api.imgbb.com) plus the Firebase origins the
         Studio actually uses. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.firebasedatabase.app https://*.firebaseio.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://i.ibb.co; connect-src 'self' https://www.gstatic.com https://api.imgbb.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://cloudflareinsights.com" />
    <meta name="theme-color" content="#f4f4f4" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Pavia · Studio</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css?v=29" />
    <link rel="stylesheet" href="../css/admin.css?v=26" />
  </head>
  <body>
    <div class="admin-shell">
      <section id="adminGate" class="admin-login" hidden aria-labelledby="admin-title">
        <div class="admin-login-copy">
          <p class="eyebrow">Admin access</p>
          <h1 id="admin-title">Studio</h1>
        </div>

        <form id="loginForm" class="admin-form" autocomplete="off">
          <div class="admin-form-head">
            <span>Sign in</span>
            <span class="admin-form-lock">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              Secure
            </span>
          </div>

          <label class="admin-field">
            <span>Password</span>
            <span class="admin-password-wrap">
              <input id="loginPass" type="password" required autocomplete="current-password" placeholder="••••••••" />
              <button type="button" class="admin-password-toggle" id="adminPasswordToggle" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>

          <button type="submit" class="admin-submit" id="adminSubmit">
            <span>Log in</span>
            <svg class="admin-submit-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
          </button>

          <p id="loginError" class="admin-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <main id="adminPayloadMount" hidden></main>
    </div>

    <script src="../admin/payload.js?v=39"></script>
    <script src="../js/firebase-config.js?v=12"></script>
    <script src="../js/backend-config.js?v=17"></script>
    <script src="../js/image-catalog.js?v=12"></script>
    <script src="../js/store-core.js?v=9"></script>
    <script src="../js/backend.js?v=21"></script>
    <script src="../js/backend-firebase.js?v=36"></script>
    <script src="../js/products.js?v=11"></script>
    <script src="../js/image-store.js?v=2"></script>
    <script src="../js/admin.js?v=21"></script>
  </body>
</html>
