<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pavia">
  <!-- Wordmark favicon: the PAVIA logo (same as assets/logo.svg) centered on a
       light brand square, so the browser tab + search favicon show the wordmark. -->
  <rect width="512" height="512" fill="#ececec"/>
  <g transform="translate(25.7 200.7) scale(0.658)">
    <text x="350" y="120" text-anchor="middle"
          font-family="'Bodoni Moda','Bodoni MT',Didot,Georgia,'Times New Roman',serif"
          font-size="150" font-weight="500" letter-spacing="6" fill="#1a1a1a">PAVIA</text>
    <line x1="14" y1="92" x2="338" y2="92" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="440" y1="146" x2="672" y2="146" stroke="#1a1a1a" stroke-width="4"/>
  </g>
</svg>
